[package]
name = "silky-runtime"
description = "Engine functions of Silky's engine games: scene state, text, and a software renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["emote"]
# E-mote characters through Eluna.
emote = ["dep:eluna"]
# E-mote characters drawn with wgpu (Metal, Vulkan, D3D12) when a frontend
# hands over a device; the software rasterizer stays for headless use.
gpu = ["emote", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
eluna = { package = "eluna_rs", path = "../../vendor/eluna_rs", optional = true }
bytemuck = { workspace = true, optional = true }
chrono.workspace = true
silky-format.workspace = true
silky-vm.workspace = true
fontdue.workspace = true
lewton.workspace = true
png.workspace = true
pollster = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true
