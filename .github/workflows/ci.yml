name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sound headers (Linux)
        if: runner.os == 'Linux'
        # Retried: the runner's package mirrors sometimes fail to resolve.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y libasound2-dev && exit 0
            sleep 20
          done
          exit 1
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: silky-rs-windows
          path: |
            target/release/silky-player.exe
            target/release/silky-run.exe
            target/release/silky-tool.exe

  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p silky-format -p silky-vm -p silky-runtime --target aarch64-apple-ios
