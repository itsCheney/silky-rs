[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/itsCheney/silky-rs"

[workspace.dependencies]
silky-format = { path = "crates/silky-format" }
silky-vm = { path = "crates/silky-vm" }
silky-runtime = { path = "crates/silky-runtime" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
fontdue = "0.9"
lewton = "0.10"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
